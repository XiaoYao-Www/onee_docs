# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/


############################################################
# Advisories
# RustSec 漏洞檢查
############################################################

[advisories]

# 低於此等級的漏洞不阻擋
# vulnerable / unsound / yanked 等問題會失敗
severity-threshold = "medium"

ignore = []



############################################################
# Licenses
# 授權檢查
############################################################

[licenses]

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0"
]





############################################################
# Bans
# 依賴管理
############################################################

[bans]

# 同一 crate 多版本
# 先警告，不阻擋
multiple-versions = "warn"

# 禁止 wildcard dependency
wildcards = "deny"




############################################################
# Sources
# crate 來源檢查
############################################################

[sources]

# 禁止未知 registry
unknown-registry = "deny"

# 禁止未知 git source
unknown-git = "deny"

allow-registry = [
    "https://github.com/rust-lang/crates.io-index"
]
[package]
name = "daily-knowledge"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
percent-encoding = "2"
notify = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
toml = "0.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

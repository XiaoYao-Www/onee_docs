name: Publish Docker Image to GHCR

# 觸發條件：
#   - 推送 v* 標籤（如 v1.0.0）→ 以 semver 版本號標記
#   - 推送 main 分支          → 以 latest 標記
on:
  push:
    tags:
      - 'v*'
    branches:
      - main

# 定義環境變數
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 依賴漏洞掃描（每次 push 執行）
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 預編譯二進位快速安裝 cargo-audit（避免 source 編譯耗時）
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  build-and-push-image:
    runs-on: ubuntu-latest

    # 【關鍵】賦予 GITHUB_TOKEN 寫入 Packages 的權限
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 取得專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 QEMU（支援跨平台建置，如 ARM64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 設定 Docker Buildx（多平台建置所需）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登入 GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 自動擷取標籤與版本號 metadata
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == 'main' }}

      # 6. 建置並推送到 GHCR（支援多平台）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
